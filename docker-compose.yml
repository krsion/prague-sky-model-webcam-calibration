version: "3.8"
services:
  chmu-perez:
    build: .
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: >
      bash -c "
        ./chmucalib.sh brno perez >> ../results/chmu-perez-log.jsonl
        ./chmucalib.sh ceske_budejovice perez >> ../results/chmu-perez-log.jsonl
        ./chmucalib.sh dukovany perez >> ../results/chmu-perez-log.jsonl
        ./chmucalib.sh holesov perez >> ../results/chmu-perez-log.jsonl
        ./chmucalib.sh nedvezi perez >> ../results/chmu-perez-log.jsonl
        ./chmucalib.sh olomouc perez >> ../results/chmu-perez-log.jsonl
        ./chmucalib.sh polom perez >> ../results/chmu-perez-log.jsonl
        ./chmucalib.sh pribyslav perez >> ../results/chmu-perez-log.jsonl
        ./chmucalib.sh primda perez >> ../results/chmu-perez-log.jsonl
        ./chmucalib.sh temelin perez >> ../results/chmu-perez-log.jsonl
      "
    working_dir: /usr/bakalarka/src

  chmu-prague:
    build: .
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: >
      bash -c "
        ./chmucalib.sh brno prague >> ../results/chmu-prague-log.jsonl
        ./chmucalib.sh ceske_budejovice prague >> ../results/chmu-prague-log.jsonl
        ./chmucalib.sh dukovany prague >> ../results/chmu-prague-log.jsonl
        ./chmucalib.sh holesov prague >> ../results/chmu-prague-log.jsonl
        ./chmucalib.sh nedvezi prague >> ../results/chmu-prague-log.jsonl
        ./chmucalib.sh olomouc prague >> ../results/chmu-prague-log.jsonl
        ./chmucalib.sh polom prague >> ../results/chmu-prague-log.jsonl
        ./chmucalib.sh pribyslav prague >> ../results/chmu-prague-log.jsonl
        ./chmucalib.sh primda prague >> ../results/chmu-prague-log.jsonl
        ./chmucalib.sh temelin prague >> ../results/chmu-prague-log.jsonl
      "
    working_dir: /usr/bakalarka/src

  chmu-perez-clean:
    build: .
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: >
      bash -c "
        ./chmucalib-clean.sh brno perez >> ../results/chmu-perez-clean-log.jsonl
        ./chmucalib-clean.sh ceske_budejovice perez >> ../results/chmu-perez-clean-log.jsonl
        ./chmucalib-clean.sh dukovany perez >> ../results/chmu-perez-clean-log.jsonl
        ./chmucalib-clean.sh holesov perez >> ../results/chmu-perez-clean-log.jsonl
        ./chmucalib-clean.sh nedvezi perez >> ../results/chmu-perez-clean-log.jsonl
        ./chmucalib-clean.sh olomouc perez >> ../results/chmu-perez-clean-log.jsonl
        ./chmucalib-clean.sh polom perez >> ../results/chmu-perez-clean-log.jsonl
        ./chmucalib-clean.sh pribyslav perez >> ../results/chmu-perez-clean-log.jsonl
        ./chmucalib-clean.sh primda perez >> ../results/chmu-perez-clean-log.jsonl
        ./chmucalib-clean.sh temelin perez >> ../results/chmu-perez-clean-log.jsonl
      "
    working_dir: /usr/bakalarka/src

  chmu-prague-clean:
    build: .
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: >
      bash -c "
        ./chmucalib-clean.sh brno prague >> ../results/chmu-prague-clean-log.jsonl
        ./chmucalib-clean.sh ceske_budejovice prague >> ../results/chmu-prague-clean-log.jsonl
        ./chmucalib-clean.sh dukovany prague >> ../results/chmu-prague-clean-log.jsonl
        ./chmucalib-clean.sh holesov prague >> ../results/chmu-prague-clean-log.jsonl
        ./chmucalib-clean.sh nedvezi prague >> ../results/chmu-prague-clean-log.jsonl
        ./chmucalib-clean.sh olomouc prague >> ../results/chmu-prague-clean-log.jsonl
        ./chmucalib-clean.sh polom prague >> ../results/chmu-prague-clean-log.jsonl
        ./chmucalib-clean.sh pribyslav prague >> ../results/chmu-prague-clean-log.jsonl
        ./chmucalib-clean.sh primda prague >> ../results/chmu-prague-clean-log.jsonl
        ./chmucalib-clean.sh temelin prague >> ../results/chmu-prague-clean-log.jsonl
      "
    working_dir: /usr/bakalarka/src

  bash:
    build: .
    container_name: bakalarka
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: bash
    working_dir: /usr/bakalarka/src

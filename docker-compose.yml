version: "3.8"
services:
  chmu-all:
    build: .
    container_name: bakalarka
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: >
      bash -c "python main.py --photos ../data/images  --masks ../data/sky-masks -n 1000 --sky-model perez -o result-perez-nosolar.json
               python main.py --photos ../data/images  --masks ../data/sky-masks -n 1000 --sky-model psm -o result-psm-nosolar.json
               python main.py --photos ../data/images  --masks ../data/sky-masks -n 1000 --sky-model perez-simple -o result-perez-simple-nosolar.json
               python main.py --photos ../data/images  --masks ../data/sky-masks -n 1000 --sky-model perez  --solar -o result-perez-solar.json
               python main.py --photos ../data/images  --masks ../data/sky-masks -n 1000 --sky-model psm --solar -o result-psm-solar.json
               python main.py --photos ../data/images  --masks ../data/sky-masks -n 1000 --sky-model perez-simple --solar -o result-perez-simple-solar.json"
    working_dir: /usr/bakalarka/src

  calibration-demo:
    build: .
    container_name: bakalarka
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: python calibration.py
    working_dir: /usr/bakalarka/src

  bash:
    build: .
    container_name: bakalarka
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: bash
    working_dir: /usr/bakalarka/src

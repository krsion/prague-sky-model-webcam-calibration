version: "3.8"
services:
  arizona-perez:
    build: .
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: >
      python3 main.py 
        -I ../webcamCalibration/images/gradient 
        -J ../webcamCalibration/images/clearDay 
        -m ../webcamCalibration/skyMask/mask.jpg 
        -n 1000 -W 720 -H 540 -f0 500 
        -df matlab-flat
        -mJ perez
    working_dir: /usr/bakalarka/src

  arizona-prague:
    build: .
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: >
      python3 main.py 
        -I ../webcamCalibration/images/gradient 
        -J ../webcamCalibration/images/clearDay 
        -m ../webcamCalibration/skyMask/mask.jpg 
        -n 1000 -W 720 -H 540 -f0 500 
        -df matlab-flat
        -mJ prague
    working_dir: /usr/bakalarka/src

  chmu-perez:
    build: .
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: >
      bash -c "
        ./chmucalib.sh ceske_budejovice perez >> chmu-perez-log.txt
        ./chmucalib.sh dukovany perez >> chmu-perez-log.txt
        ./chmucalib.sh holesov perez >> chmu-perez-log.txt
        ./chmucalib.sh olomouc perez >> chmu-perez-log.txt
        ./chmucalib.sh pribyslav perez >> chmu-perez-log.txt
        ./chmucalib.sh polom perez >> chmu-perez-log.txt
        ./chmucalib.sh primda perez >> chmu-perez-log.txt
        ./chmucalib.sh temelin perez >> chmu-perez-log.txt
        ./chmucalib.sh brno perez >> chmu-perez-log.txt
        ./chmucalib.sh nedvezi perez >> chmu-perez-log.txt
      "
    working_dir: /usr/bakalarka/src

  chmu-prague:
    build: .
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: >
      bash -c "
        ./chmucalib.sh ceske_budejovice prague >> chmu-prague-log.txt
        ./chmucalib.sh dukovany prague >> chmu-prague-log.txt
        ./chmucalib.sh holesov prague >> chmu-prague-log.txt
        ./chmucalib.sh olomouc prague >> chmu-prague-log.txt
        ./chmucalib.sh pribyslav prague >> chmu-prague-log.txt
        ./chmucalib.sh polom prague >> chmu-prague-log.txt
        ./chmucalib.sh primda prague >> chmu-prague-log.txt
        ./chmucalib.sh temelin prague >> chmu-prague-log.txt
        ./chmucalib.sh brno prague >> chmu-prague-log.txt
        ./chmucalib.sh nedvezi prague >> chmu-prague-log.txt
      "
    working_dir: /usr/bakalarka/src

  bash:
    build: .
    container_name: bakalarka
    volumes:
      - .:/usr/bakalarka
    stdin_open: true
    tty: true
    command: bash
    working_dir: /usr/bakalarka/src
